<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판</title>
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <div id="root">
      <h1 class="box-center">게시판</h1>
      <ul id="list">
        <li class="header">
          <ul class="row">
            <li class="num box-center">번호</li>
            <li class="title box-center">제목</li>
            <li class="writer box-center">글쓴이</li>
            <li class="createdAt box-center">등록일</li>
          </ul>
        </li>
        <li class="item">
          <ul class="row">
            <li class="num box-center">1</li>
            <li class="title">오늘 점심</li>
            <li class="writer box-center">이정배</li>
            <li class="createdAt box-center">24-03-28</li>
          </ul>
        </li>
        <li class="item">
          <ul class="row">
            <li class="num box-center">1</li>
            <li class="title">오늘 점심</li>
            <li class="writer box-center">이정배</li>
            <li class="createdAt box-center">24-03-28</li>
          </ul>
        </li>
      </ul>
      <form action="" id="write">
        <fieldset>
          <legend>게시글 등록</legend>
          <div class="input-box">
            <label for="title">제목 : </label>
            <input type="text" id="title" />
          </div>
          <div class="input-box">
            <label for="writer"> 글쓴이 : </label>
            <input type="text" id="writer" />
          </div>
          <div class="input-box">
            <label for="text"> 내용 : </label>
            <input type="text" id="text" />
          </div>
          <div>
            <button id="add-btn">등록</button>
            <button type="reset" id="cancel-btn">취소</button>
          </div>
        </fieldset>
      </form>
      <div class="board">
        <div>제목</div>
        <div>글쓴이</div>
        <div>내용</div>
      </div>
      <script src="board.js"></script>
    </div>
  </body>
</html>
